name: Generate figure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python sir_model.py

      - name: Publish image to the figures branch
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/figures
          if git ls-remote --exit-code --heads "$REPO_URL" figures >/dev/null; then
            git clone --branch figures --single-branch "$REPO_URL" /tmp/figures
          else
            mkdir /tmp/figures
            git -C /tmp/figures init -b figures
            git -C /tmp/figures remote add origin "$REPO_URL"
          fi
          cp sir_plot.png /tmp/figures/
          cd /tmp/figures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sir_plot.png
          if git diff --cached --quiet; then
            echo "Figure unchanged"
            exit 0
          fi
          git commit -m "Update figure from ${GITHUB_SHA}"
          git push origin figures

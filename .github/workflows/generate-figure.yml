name: Generate figure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python sir_model.py

      - name: Publish image to the figures branch
        run: |
          mkdir -p /tmp/figures
          cp sir_plot.png /tmp/figures/
          cd /tmp/figures
          git init -b figures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sir_plot.png
          git commit -m "Update figure from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" figures
